name: VPS Health Monitor

# Mora aqui (repo PUBLICO) porque minutos de Actions sao gratuitos em repo publico.
# Veio de MarinaVeauvy/aguia-trader (privado), onde queimava ~3.000 min/mes (1 min cobrado por run).
# IP fica em secret para nao expor o host publicamente.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Envia uma mensagem de teste no Telegram (nao altera o estado salvo)'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check VPS SSH port
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VPS_IP: ${{ secrets.VPS_IP }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          set -u
          # Falha cedo e alto: sem credencial o monitor nao consegue avisar (bug do repo antigo).
          for v in TG_TOKEN TG_CHAT REDIS_URL REDIS_TOKEN VPS_IP; do
            if [ -z "${!v}" ]; then echo "::error::secret $v ausente — o alerta nao chegaria"; exit 1; fi
          done

          send() {
            code=$(curl -s -o /tmp/tg.out -w '%{http_code}' -X POST \
              "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" -d parse_mode=HTML -d text="$1")
            echo "telegram HTTP $code"
            if [ "$code" != "200" ]; then echo "::error::Telegram recusou o alerta: $(cat /tmp/tg.out)"; return 1; fi
          }

          if [ "$TEST_ALERT" = "true" ]; then
            send "🧪 <b>Teste do VPS Health Monitor</b>%0ARodando de MarinaVeauvy/trading-cron (repo público, minutos grátis).%0ASe você recebeu isto, o alerta funciona." || exit 1
            echo "teste enviado; sem alterar estado"; exit 0
          fi

          if timeout 10 bash -c "</dev/tcp/$VPS_IP/22" 2>/dev/null; then CURRENT=up; else CURRENT=down; fi
          PREV=$(curl -s -H "Authorization: Bearer $REDIS_TOKEN" "$REDIS_URL/get/vps:status" | grep -oP '(?<="result":")[^"]*' || echo unknown)
          echo "VPS status: $CURRENT (anterior: $PREV)"

          if [ "$CURRENT" = down ] && [ "$PREV" != down ]; then
            send "🚨 <b>VPS OFFLINE</b>%0AIP: $VPS_IP%0ASSH porta 22 não responde%0AAuto-trades pausados até a VPS voltar"
            curl -s -X POST -H "Authorization: Bearer $REDIS_TOKEN" "$REDIS_URL/set/vps:status/down?EX=86400" > /dev/null
          elif [ "$CURRENT" = up ] && [ "$PREV" = down ]; then
            send "✅ <b>VPS RECUPERADA</b>%0AIP: $VPS_IP%0ASSH respondendo de novo%0AAuto-trades retomam nos próximos ciclos"
            curl -s -X POST -H "Authorization: Bearer $REDIS_TOKEN" "$REDIS_URL/set/vps:status/up?EX=86400" > /dev/null
          elif [ "$CURRENT" = up ] && [ "$PREV" != up ]; then
            curl -s -X POST -H "Authorization: Bearer $REDIS_TOKEN" "$REDIS_URL/set/vps:status/up?EX=86400" > /dev/null
          fi

          [ "$CURRENT" = up ] || exit 1
